name: Build Wails releases

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  APP_NAME: Ally
  WAILS_VERSION: v3.0.0-beta.7
  RG_VERSION: 15.1.0
  ALLY_BUILD_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Wails
        shell: pwsh
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}"

      - name: Inject release version into exe metadata
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.ref_name }}"
          $base = (($tag -replace '^v', '') -split '[-+]')[0]
          $parts = $base -split '\.'
          if ($parts.Count -ge 3 -and $parts[0] -match '^\d+$' -and $parts[1] -match '^\d+$' -and $parts[2] -match '^\d+$') {
            $product = "$($parts[0]).$($parts[1]).$($parts[2])"
            $file = "$product.$($parts[3] ?? '0')"
            $json = Get-Content build/windows/info.json -Raw | ConvertFrom-Json
            $json.fixed.file_version = $file
            $json.info.'0000'.ProductVersion = $product
            $out = $json | ConvertTo-Json -Depth 10
            [System.IO.File]::WriteAllText((Resolve-Path build/windows/info.json), $out, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Injected native version: product=$product file=$file"
          } else {
            Write-Host "Tag '$tag' is not a semantic release version; keeping 0.0.0"
          }

      - name: Build
        shell: pwsh
        run: |
          wails3 build

      - name: Bundle ripgrep and licenses
        shell: pwsh
        run: |
          $asset = "ripgrep-${{ env.RG_VERSION }}-x86_64-pc-windows-msvc.zip"
          $base = "https://github.com/BurntSushi/ripgrep/releases/download/${{ env.RG_VERSION }}"
          Invoke-WebRequest "$base/$asset" -OutFile $asset
          Invoke-WebRequest "$base/$asset.sha256" -OutFile "$asset.sha256"
          $expected = [regex]::Match((Get-Content "$asset.sha256" -Raw), '(?i)\b[0-9a-f]{64}\b').Value.ToLowerInvariant()
          if (-not $expected) { throw "ripgrep checksum file did not contain a SHA-256 hash" }
          $actual = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ripgrep checksum mismatch" }

          Expand-Archive $asset -DestinationPath rg-dist
          $rg = Get-ChildItem rg-dist -Recurse -Filter rg.exe | Select-Object -First 1
          if (-not $rg) { throw "rg.exe was not found in the ripgrep archive" }

          New-Item -ItemType Directory -Force dist/tools, dist/third_party/ripgrep | Out-Null
          Copy-Item "bin/${{ env.APP_NAME }}.exe" dist/
          Copy-Item $rg.FullName dist/tools/rg.exe
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md dist/
          Copy-Item third_party/ripgrep/* dist/third_party/ripgrep/
          & dist/tools/rg.exe --version

          $version = "${{ github.event.release.tag_name || github.ref_name }}"
          Compress-Archive -Path dist/* -DestinationPath "${{ env.APP_NAME }}-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Ally-windows-x64
          path: Ally-*-windows-x64.zip
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: Ally-*-windows-x64.zip
          fail_on_unmatched_files: true

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}"

      - name: Build
        run: |
          wails3 build

      - name: Bundle ripgrep and licenses
        shell: bash
        run: |
          set -euo pipefail
          asset="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}"
          curl --fail --location --retry 3 -o "$asset" "$base/$asset"
          curl --fail --location --retry 3 -o "$asset.sha256" "$base/$asset.sha256"
          sha256sum --check "$asset.sha256"

          mkdir -p rg-dist dist/tools dist/third_party/ripgrep
          tar -xzf "$asset" -C rg-dist
          rg_path="$(find rg-dist -type f -name rg -print -quit)"
          test -n "$rg_path"

          cp "bin/${APP_NAME}" dist/
          cp "$rg_path" dist/tools/rg
          cp LICENSE THIRD_PARTY_NOTICES.md README.md dist/
          cp third_party/ripgrep/* dist/third_party/ripgrep/
          chmod +x "dist/${APP_NAME}" dist/tools/rg
          dist/tools/rg --version

          # Provide a .desktop entry and icon so the app appears with the correct
          # icon in desktop environments when the archive is unpacked.
          cat > "dist/${APP_NAME}.desktop" <<EOF
          [Desktop Entry]
          Version=1.0
          Name=${APP_NAME}
          Comment=Ally — AI coding agent desktop
          Exec=${APP_NAME}
          Terminal=false
          Type=Application
          Icon=${APP_NAME}
          Categories=Development;
          StartupWMClass=${APP_NAME}
          EOF
          cp build/appicon.png "dist/${APP_NAME}.png"

          version="${{ github.event.release.tag_name || github.ref_name }}"
          root_dir="${APP_NAME}-$version-linux-x64"
          # 打包时把顶层 dist 重命名为 root_dir，解压后所有文件归在统一目录下
          tar -czf "${root_dir}.tar.gz" --transform "s,^dist,${root_dir}," dist

      - uses: actions/upload-artifact@v4
        with:
          name: Ally-linux-x64
          path: Ally-*-linux-x64.tar.gz
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: Ally-*-linux-x64.tar.gz
          fail_on_unmatched_files: true

  macos:
    name: macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Wails
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}"

      - name: Build universal binary
        run: |
          wails3 task darwin:build:universal

      - name: Inject release version into macOS bundle metadata
        run: |
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          base="${tag#v}"
          base="${base%%[-+]*}"
          if [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $base" build/darwin/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $base" build/darwin/Info.plist
            echo "Injected native version: $base"
          else
            echo "Tag '$tag' is not a semantic release version; keeping 0.0.0"
          fi

      - name: Package universal .app
        run: |
          wails3 task darwin:package:universal

      - name: Bundle universal ripgrep and licenses
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}"
          mkdir -p rg-arm64 rg-x64

          for arch in aarch64 x86_64; do
            asset="ripgrep-${RG_VERSION}-${arch}-apple-darwin.tar.gz"
            curl --fail --location --retry 3 -o "$asset" "$base/$asset"
            curl --fail --location --retry 3 -o "$asset.sha256" "$base/$asset.sha256"
            shasum -a 256 -c "$asset.sha256"
            if [ "$arch" = "aarch64" ]; then target=rg-arm64; else target=rg-x64; fi
            tar -xzf "$asset" -C "$target"
          done

          arm_rg="$(find rg-arm64 -type f -name rg -print -quit)"
          x64_rg="$(find rg-x64 -type f -name rg -print -quit)"
          test -n "$arm_rg"
          test -n "$x64_rg"

          app="bin/${APP_NAME}.app"
          mkdir -p "$app/Contents/MacOS/tools" "$app/Contents/Resources/licenses/ripgrep"
          lipo -create "$arm_rg" "$x64_rg" -output "$app/Contents/MacOS/tools/rg"
          chmod +x "$app/Contents/MacOS/tools/rg"
          cp LICENSE THIRD_PARTY_NOTICES.md "$app/Contents/Resources/licenses/"
          cp third_party/ripgrep/* "$app/Contents/Resources/licenses/ripgrep/"
          lipo -info "$app/Contents/MacOS/tools/rg"
          "$app/Contents/MacOS/tools/rg" --version

          mkdir -p dmg-root
          cp -R "$app" dmg-root/
          cp LICENSE THIRD_PARTY_NOTICES.md README.md dmg-root/
          cp scripts/open-ally-macos.command "dmg-root/免签名启动Ally.command"
          chmod +x "dmg-root/免签名启动Ally.command"
          ln -s /Applications dmg-root/Applications
          version="${{ github.event.release.tag_name || github.ref_name }}"
          hdiutil create -volname "${APP_NAME}" -srcfolder dmg-root -ov -format UDZO "${APP_NAME}-$version-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Ally-macos-universal
          path: Ally-*-macos-universal.dmg
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: Ally-*-macos-universal.dmg
          fail_on_unmatched_files: true
