name: Build MyGo releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to build and publish (e.g. v1.28.0)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ally-release
  cancel-in-progress: false

jobs:
  build:
    name: Cross-platform release packages
    runs-on: macos-15
    env:
      BUILD_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      CGO_ENABLED: '0'
      GOGC: '30'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check builder, publisher and update contracts
        run: |
          bash -n scripts/build-all.sh scripts/build.command
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          go test -p 1 ./internal/app -run Update

      - name: Prepare unpublished release and bundled notes
        run: python3 scripts/release.py prepare "$BUILD_TAG"

      - name: Build all seven packages
        run: |
          export ALLY_RELEASE_NOTES_BODY="$(cat .tmp/release-notes.md)"
          bash scripts/build-all.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Ally-${{ inputs.tag || github.ref_name }}
          path: dist/release/*
          if-no-files-found: error

      - name: Upload, verify every architecture, then publish
        run: python3 scripts/release.py publish "$BUILD_TAG"
