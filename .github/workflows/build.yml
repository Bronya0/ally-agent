name: Build MyGo releases

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Cross-platform release packages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check shared builder and entry points
        run: |
          bash -n scripts/build-all.sh scripts/build.command
          python3 -m unittest discover -s scripts -p 'test_build.py' -v

      - name: Build portable archives and ad-hoc universal DMG
        env:
          BUILD_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          ALLY_RELEASE_NOTES_BODY: ${{ github.event.release.body }}
          CGO_ENABLED: '0'
          GOGC: '30'
          GOMAXPROCS: '2'
        run: bash scripts/build-all.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Ally-${{ github.event.release.tag_name || github.ref_name }}
          path: |
            dist/release/*-windows-*.zip
            dist/release/*-linux-*.tar.gz
            dist/release/*-macos-*.dmg
          if-no-files-found: error

      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'release'
        with:
          files: |
            dist/release/*-windows-*.zip
            dist/release/*-linux-*.tar.gz
            dist/release/*-macos-*.dmg
          fail_on_unmatched_files: true
